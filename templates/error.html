<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Sistema de Análisis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1 class="header-title">⚠️ Error en el Sistema</h1>
            </div>
        </header>

        <main>
            <div class="welcome-section">
                <div class="welcome-icon" style="color: #dc3545;">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h2 class="welcome-title">Ha ocurrido un error</h2>
                <p class="welcome-text" style="color: #dc3545;">
                    {{ error }}
                </p>
                <button class="nav-button" onclick="window.location.href='/'">
                    <i class="fas fa-home"></i>
                    Volver al Inicio
                </button>
            </div>
        </main>
    </div>
</body>
</html>
